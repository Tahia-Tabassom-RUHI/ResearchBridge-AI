<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:13px system-ui;color:#e7f3f4;background:#0b1721}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #244452;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{color:#8eb8bf;font-size:11px;font-weight:500}tr[data-row]{cursor:pointer}tr[data-row]:hover{background:#173440}tr.selected{background:#20505a}th:first-child{width:38%}th:nth-child(2){width:32%}table:focus{outline:1px solid teal}
</style></head><body><table tabindex="0" aria-label="Saved searches"><thead></thead><tbody></tbody></table><script>
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');let selected=-1;
const emit=action=>send('streamlit:setComponentValue',{value:{index:selected,action,nonce:Date.now()}});
addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;const rows=e.data.args.rows||[];document.body.style.background=e.data.args.light?'#f8fcfd':'#0b1721';document.body.style.color=e.data.args.light?'#173946':'#e7f3f4';const head=document.querySelector('thead');head.replaceChildren();const hr=document.createElement('tr');for(const key of Object.keys(rows[0]||{})){const th=document.createElement('th');th.textContent=key;hr.append(th)}head.append(hr);const body=document.querySelector('tbody');body.replaceChildren();rows.forEach((row,i)=>{const tr=document.createElement('tr');tr.dataset.row=i;tr.tabIndex=0;if(i===selected)tr.className='selected';for(const value of Object.values(row)){const td=document.createElement('td');td.textContent=value;td.title=String(value);tr.append(td)}tr.onclick=()=>{selected=i;document.querySelectorAll('tbody tr').forEach(r=>r.classList.toggle('selected',r===tr));emit('select')};tr.ondblclick=()=>{selected=i;emit('open')};tr.onkeydown=e=>{if(e.key==='Enter'){selected=i;emit('open')}};body.append(tr)});send('streamlit:setFrameHeight',{height:Math.max(400,Math.min(600,rows.length*40+40))})});send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
