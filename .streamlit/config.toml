[server]
enableStaticServing = true
headless = true
fileWatcherType = "poll"
runOnSave = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#835a24"
backgroundColor = "#f8efdd"
secondaryBackgroundColor = "#fff8eb"
textColor = "#30251f"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#242120"
secondaryBackgroundColor = "#48413a"
textColor = "#eee4d7"
